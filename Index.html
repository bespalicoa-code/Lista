<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evidența banilor clasei</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f4f9;
    margin: 0;
    padding: 20px;
    color: #172033;
}
.container {
    max-width: 900px;
    margin: auto;
}
h1 { text-align: center; }
.stats {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 20px;
    font-size: 18px;
    font-weight: bold;
}
input[type="search"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
    margin-bottom: 15px;
}
table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: hidden;
}
th, td {
    padding: 12px 8px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}
th { background: #273449; color: white; }
tr.paid { background: #e6f8eb; }
.amount {
    width: 85px;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
}
.name {
    width: 100%;
    min-width: 110px;
    box-sizing: border-box;
    padding: 6px;
    border: 1px solid transparent;
    background: transparent;
    font-size: 14px;
}
.name:focus { border-color: #4f46e5; }
button {
    padding: 10px 14px;
    border: 0;
    border-radius: 7px;
    background: #4f46e5;
    color: white;
    cursor: pointer;
    margin: 4px 2px;
}
@media(max-width:600px) {
    body { padding: 8px; }
    table { font-size: 12px; }
    th, td { padding: 8px 4px; }
    .amount { width: 60px; }
}
</style>
</head>
<body>
<div class="container">
<h1>Evidența banilor clasei</h1>

<div class="stats">
    💰 Total încasat: <span id="total">0</span> lei<br><br>
    ✅ Au plătit: <span id="paid">0</span> din 24<br><br>
    ⏳ Mai au de plătit: <span id="left">24</span>
</div>

<input type="search" id="search"
placeholder="Caută un elev după nume..." oninput="render()">

<button onclick="unpaidOnly=true;render()">Doar cei care nu au plătit</button>
<button onclick="unpaidOnly=false;render()">Arată toți elevii</button>
<button onclick="exportCSV()">Descarcă lista</button>

<table>
<thead>
<tr>
<th>Nr.</th>
<th>Nume și prenume</th>
<th>Suma (lei)</th>
<th>Plătit</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
</div>

<script>
const names = [
"Chicu Marius",
"Ciobanu Nicoleta",
"Yangan Clara",
"Yangan Lavina",
"Iurciuc Nicolae",
"Yhemu Alexandru",
"Yherta Evelina",
"Yonta Lucian",
"Harea Felicia",
"Leahu Maxim",
"Melnic Gabriela",
"Mereacre Mihai",
"Morosan Mirela",
"Murug Nicoleta",
"Pananyan Artion",
"Sarani Dario",
"Soho Mihai",
"Rata Constantin",
"Frati Darius",
"Selifos Ocaana",
"Smolenschi Denis",
"Surlicin Emma",
"Sataru Mario",
"Lezdeanu Simion"
];

const KEY = "evidenta_elevi_clasa";
let unpaidOnly = false;
let students;

try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    students = Array.isArray(saved) && saved.length === names.length
        ? saved
        : names.map(name => ({name, amount:"", paid:false}));
} catch(e) {
    students = names.map(name => ({name, amount:"", paid:false}));
}

function save() {
    localStorage.setItem(KEY, JSON.stringify(students));
}

function render() {
    const list = document.getElementById("list");
    const query = document.getElementById("search").value.toLowerCase();
    list.innerHTML = "";

    students.forEach((s, i) => {
        if (unpaidOnly && s.paid) return;
        if (!s.name.toLowerCase().includes(query)) return;

        const tr = document.createElement("tr");
        if (s.paid) tr.className = "paid";

        const number = document.createElement("td");
        number.textContent = i + 1;

        const nameCell = document.createElement("td");
        const nameInput = document.createElement("input");
        nameInput.className = "name";
        nameInput.value = s.name;
        nameInput.setAttribute("aria-label", "Numele elevului");
        nameInput.onchange = () => {
            students[i].name = nameInput.value.trim() || names[i];
            save();
            render();
        };
        nameCell.appendChild(nameInput);

        const amountCell = document.createElement("td");
        const amountInput = document.createElement("input");
        amountInput.className = "amount";
        amountInput.type = "number";
        amountInput.min = "0";
        amountInput.step = "0.01";
        amountInput.placeholder = "0";
        amountInput.value = s.amount;
        amountInput.onchange = () => {
            const value = Number(amountInput.value);
            students[i].amount =
                amountInput.value !== "" && value >= 0 ? value : "";
            if (value > 0) students[i].paid = true;
            save();
            render();
        };
        amountCell.appendChild(amountInput);

        const paidCell = document.createElement("td");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = s.paid;
        checkbox.onchange = () => {
            students[i].paid = checkbox.checked;
            save();
            render();
        };
        paidCell.appendChild(checkbox);

        const label = document.createElement("span");
        label.textContent = s.paid ? " Da" : " Nu";
        paidCell.appendChild(label);

        tr.append(number, nameCell, amountCell, paidCell);
        list.appendChild(tr);
    });

    const total = students.reduce(
        (sum, s) => sum + (Number(s.amount) || 0), 0
    );
    const paid = students.filter(s => s.paid).length;

    document.getElementById("total").textContent =
        total.toLocaleString("ro-RO");
    document.getElementById("paid").textContent = paid;
    document.getElementById("left").textContent = students.length - paid;
}

function exportCSV() {
    const rows = [
        ["Nr.", "Nume și prenume", "Suma (lei)", "Plătit"],
        ...students.map((s, i) => [
            i + 1, s.name, s.amount || 0, s.paid ? "Da" : "Nu"
        ])
    ];
    const csv = "\uFEFF" + rows.map(row =>
        row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(";")
    ).join("\r\n");

    const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8;"
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "evidenta_bani_clasa.csv";
    a.click();
    URL.revokeObjectURL(url);
}

render();
</script>
</body>
</html>
